// 本仓库用 pnpm 的 node-linker=hoisted（Metro 的 haste 要求扁平布局），
// 依赖因此被提升到**仓库根**的 node_modules，而不是 apps/mobile/node_modules。
// RN 模板默认写 "../node_modules/..."，在 monorepo 里会指向不存在的路径，
// 报 "Included build ... does not exist"。
// 这里比模板多向上走两级：apps/mobile/android -> apps/mobile -> apps -> 仓库根。
//
// 必须是文件里的**第一条语句**：Gradle 要求 pluginManagement 之前不能有任何语句
// （之前试过在文件顶部用 def 先算路径，直接 ScriptCompilationException）。
// 用字符串相对路径而不是 File 对象，与模板保持完全一致的解析方式。
pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'LycoMusic'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')
