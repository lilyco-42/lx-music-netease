appId: top.lain42.lxmusic
productName: LX Music
copyright: Copyright © 2026 lain42

# 必须显式指定：本仓库用 node-linker=hoisted，electron 被提升到仓库根的
# node_modules，electron-builder 从 apps/desktop 向上探测不到，会报
# "Cannot compute electron version from installed node modules"。
# 指定后 electron-builder 直接按版本下载官方发行包。
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

# 不签名：Windows/macOS 安装包为未签名版本
# macOS 首次打开需右键 -> 打开；Windows 可能提示 SmartScreen
forceCodeSigning: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}

msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LX Music
  artifactName: ${productName}-${version}-windows-${arch}.msi

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LX Music
  artifactName: ${productName}-${version}-windows-setup.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-macos-${arch}.${ext}

dmg:
  # 必须带 ${arch}：x64 与 arm64 两个 DMG 是并发构建的，若卷名相同
  # （都叫 "LX Music 0.1.0"），第二个卷会挂成 "... 1"，
  # 随后 hdiutil detach 因卷名冲突以 exit 16 (resource busy) 失败，
  # dmgbuild 接着找不到 /Volumes/<name>/.background/background.tiff。
  # 卷名按架构区分即可根治。
  title: ${productName} ${version} ${arch}

linux:
  icon: build/icon.png
  category: Audio
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}