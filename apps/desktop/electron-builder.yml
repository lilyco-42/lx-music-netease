appId: top.lain42.lxmusic
productName: LX Music
copyright: Copyright © 2026 lain42

# 关于文件名：显示名（productName）保留空格，但 **artifactName 一律用
# "LX.Music" 这个不带空格的字面量**，不要写成 ${productName}。
# 因为 ${productName} = "LX Music"，产物会叫 "LX Music-0.1.0-windows-setup.exe"，
# 空格在 URL 里必须转义成 %20；下载页的直链一旦被浏览器/下载器二次编码就会 404。
# 用点号代替空格，文件名全平台安全。

# 必须显式指定：本仓库用 node-linker=hoisted，electron 被提升到仓库根的
# node_modules，electron-builder 从 apps/desktop 向上探测不到，会报
# "Cannot compute electron version from installed node modules"。
# 指定后 electron-builder 直接按版本下载官方发行包。
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

# 不签名：Windows/macOS 安装包为未签名版本
# macOS 首次打开需右键 -> 打开；Windows 可能提示 SmartScreen
forceCodeSigning: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: LX.Music-${version}-windows-${arch}.${ext}

msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LX Music
  artifactName: LX.Music-${version}-windows-${arch}.msi

# portable 必须单独写 artifactName。
# 不写的话它会回退到 win.artifactName（LX.Music-<ver>-windows-<arch>.${ext}），
# 与上面的 msi 规则求值后**同名**，便携版 exe 会直接覆盖刚打好的 msi。
# 实测证据：服务器上 LX.Music-0.1.0-windows-x64.msi 的首字节是 4d5a（MZ，PE 可执行），
# 而真正的 MSI 是 OLE2 复合文档，必须以 d0cf11e0 开头。
# CI 日志也印证了：building target=portable file=release\LX.Music-0.1.0-windows-x64.msi
portable:
  artifactName: LX.Music-${version}-windows-${arch}-portable.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LX Music
  artifactName: LX.Music-${version}-windows-setup.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: LX.Music-${version}-macos-${arch}.${ext}

dmg:
  # 必须带 ${arch}：x64 与 arm64 两个 DMG 是并发构建的，若卷名相同
  # （都叫 "LX Music 0.1.0"），第二个卷会挂成 "... 1"，
  # 随后 hdiutil detach 因卷名冲突以 exit 16 (resource busy) 失败，
  # dmgbuild 接着找不到 /Volumes/<name>/.background/background.tiff。
  # 卷名按架构区分即可根治。
  title: ${productName} ${version} ${arch}

linux:
  icon: build/icon.png
  category: Audio
  target:
    - target: AppImage
      arch: [x64]
  artifactName: LX.Music-${version}-linux-${arch}.${ext}