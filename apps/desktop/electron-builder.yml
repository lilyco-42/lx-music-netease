appId: top.lain42.lxmusic
productName: LX Music
copyright: Copyright © 2026 lain42

# 必须显式指定：本仓库用 node-linker=hoisted，electron 被提升到仓库根的
# node_modules，electron-builder 从 apps/desktop 向上探测不到，会报
# "Cannot compute electron version from installed node modules"。
# 指定后 electron-builder 直接按版本下载官方发行包。
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

# 不签名：Windows/macOS 安装包为未签名版本
# macOS 首次打开需右键 -> 打开；Windows 可能提示 SmartScreen
forceCodeSigning: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LX Music
  artifactName: ${productName}-${version}-windows-setup.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-macos-${arch}.${ext}

dmg:
  title: ${productName} ${version}

linux:
  icon: build/icon.png
  category: Audio
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}